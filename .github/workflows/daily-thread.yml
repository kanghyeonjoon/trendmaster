name: 매일 아침 스레드 발송

on:
  schedule:
    # 22:00 UTC = 07:00 KST (한국은 서머타임이 없어 연중 고정)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "메일을 보내지 않고 로그로만 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-thread
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: threads_daily/requirements.txt

      - name: 의존성 설치
        run: pip install -r threads_daily/requirements.txt

      - name: 오늘의 스레드 생성 및 발송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python threads_daily/main.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 발송 기록 커밋
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- threads_daily/state/history.json; then
            echo "기록 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads_daily/state/history.json
          # [skip ci] — 기록 커밋이 Pages 배포까지 매일 다시 돌리지 않도록
          git commit -m "스레드 발송 기록 ($(TZ=Asia/Seoul date +%Y-%m-%d)) [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
